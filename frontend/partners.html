{{define "partners"}}{{if .Partners}}<section class="fv-partners" aria-labelledby="partners-heading"><div class="fv-partners-inner"><h2 id="partners-heading">{{.Partners.Title}}</h2><p>{{.Partners.Body}}</p><div class="fv-partners-groups">{{range $index, $group := .Partners.Groups}}<section class="fv-partners-group" aria-labelledby="partner-group-{{$index}}"><h3 id="partner-group-{{$index}}">{{.Title}}</h3><ul>{{range .Logos}}<li><img src="/assets/company/partners/{{.File}}.webp" alt="{{.Name}}" width="240" height="120" loading="lazy" decoding="async"></li>{{end}}</ul></section>{{end}}</div></div></section>{{end}}{{end}}
