# Public domains expose CMS robots and per-page indexing policies.
# ACME validation stays reachable over HTTP for automatic renewal.
server {
    listen 80;
    server_name freightvanta.com www.freightvanta.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://freightvanta.com$request_uri;
    }
}

server {
    listen 80;
    server_name de.freightvanta.com fr.freightvanta.com es.freightvanta.com it.freightvanta.com nl.freightvanta.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

# All six sites share a certificate, with explicit CMS host bindings.
server {
    listen 443 ssl;
    server_name freightvanta.com de.freightvanta.com fr.freightvanta.com es.freightvanta.com it.freightvanta.com nl.freightvanta.com;
    ssl_certificate /etc/letsencrypt/live/freightvanta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freightvanta.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CZCMS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 64m;
    # Keep the native XML tree readable in Chrome/Edge on all six sites.
    # This also covers the current application release until its next update.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CZCMS-Local-Preview "";
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CZCMS-Local-Preview "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 150s;
        sub_filter_once on;
        sub_filter '</head>' '$czcms_google_verification</head>';
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CZCMS-Local-Preview "";
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
    }
}

server {
    listen 443 ssl;
