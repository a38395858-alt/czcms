# Old language ports remain redirects while all sites use domain roots.
map $server_port $czcms_language_origin {
    8443 https://fr.freightvanta.com;
    8444 https://es.freightvanta.com;
    8445 https://it.freightvanta.com;
    8446 https://nl.freightvanta.com;
    default https://freightvanta.com;
}

# Search Console URL-prefix verification is emitted in all six public homepage heads.
# Keep this in the proxy config so application releases retain the verification.
map $host $czcms_google_verification {
    default "";
    freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
    de.freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
    fr.freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
    es.freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
    it.freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
    nl.freightvanta.com '<meta name="google-site-verification" content="FVVBvI62VSiXjv-LsyZsonGWv9irCwGa17VFT5I--UA" />';
}

server {
    listen 80 default_server;
    server_name 170.106.116.93;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /robots.txt {
        default_type text/plain;
        expires -1;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://freightvanta.com$request_uri;
    }
}

# Preserve old language URLs with method-preserving redirects.
server {
    listen 8443 ssl;
    listen 8444 ssl;
    listen 8445 ssl;
    listen 8446 ssl;
    server_name 170.106.116.93;
    ssl_certificate /etc/letsencrypt/live/czcms-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/czcms-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CZCMS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        expires -1;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        return 308 $czcms_language_origin$request_uri;
    }
}

