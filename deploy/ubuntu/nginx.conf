server {
    listen 80 default_server;
    server_name 170.106.116.93;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /robots.txt {
        default_type text/plain;
        expires -1;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://170.106.116.93$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 170.106.116.93;
    ssl_certificate /etc/letsencrypt/live/czcms-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/czcms-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CZCMS:10m;
    ssl_session_timeout 1d;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        expires -1;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_hide_header X-Robots-Tag;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CZCMS-Local-Preview "";
        proxy_set_header Connection "";
        proxy_read_timeout 150s;
    }
}
